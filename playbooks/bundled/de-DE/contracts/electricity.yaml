schemaVersion: 1
id: de.contract.electricity
version: 1.1.0
name: Electricity contract
label_i18n:
  de: Stromvertrag
description: Track an electricity contract and prepare a tariff or provider review.
locale: de-DE
category: contracts

fields:
  - key: provider
    type: text
    label: Provider
    label_i18n:
      de: Anbieter
    recommended: true
    carryForward: true
  - key: customer_number
    type: text
    label: Customer number / contract account
    label_i18n:
      de: Kundennummer / Vertragskonto
    carryForward: true
  - key: contract_end
    type: date
    label: Contract end date
    label_i18n:
      de: Vertragsende
    recommended: true
    carryForward: false
  - key: notice_period
    type: text
    label: Notice period
    label_i18n:
      de: Kündigungsfrist
    carryForward: false
  - key: meter_number
    type: text
    label: Meter number
    label_i18n:
      de: Zählernummer
    recommended: true
    carryForward: true
  - key: market_location_id
    type: text
    label: Market location ID
    label_i18n:
      de: MaLo-ID
    carryForward: true
  - key: annual_consumption
    type: text
    label: Annual consumption
    label_i18n:
      de: Jahresverbrauch
    carryForward: false
  - key: tariff_name
    type: text
    label: Tariff name
    label_i18n:
      de: Tarifname
    carryForward: false
  - key: energy_price
    type: text
    label: Energy price
    label_i18n:
      de: Arbeitspreis
    carryForward: false
  - key: base_price
    type: currency
    label: Base price
    label_i18n:
      de: Grundpreis
    carryForward: false
  - key: monthly_payment
    type: currency
    label: Monthly payment
    label_i18n:
      de: Monatlicher Abschlag
    carryForward: false

events:
  - key: contract_ends
    label: Contract ends
    label_i18n:
      de: Vertrag endet
    sourceField: contract_end

actions:
  - key: check_tariff
    label: Review electricity tariff
    label_i18n:
      de: Stromtarif prüfen
    due:
      event: contract_ends
      offset: { months: -3 }
  - key: compare_offers
    label: Compare offers
    label_i18n:
      de: Angebote vergleichen
    dependsOn: [check_tariff]
  - key: decide_change
    label: Decide on switching or renewal
    label_i18n:
      de: Wechsel / Verlängerung entscheiden
    dependsOn: [compare_offers]
  - key: complete_change
    label: Complete provider switch
    label_i18n:
      de: Wechsel durchführen
    due:
      event: contract_ends
      offset: { weeks: -6 }
    dependsOn: [decide_change]
  - key: record_new_contract
    label: Record new contract data
    label_i18n:
      de: Neue Vertragsdaten eintragen
    dependsOn: [complete_change]
