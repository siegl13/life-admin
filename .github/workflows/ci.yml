name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run playbooks:validate
      - run: npm run test:unit
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image (every push/PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            APP_REVISION=${{ github.sha }}
      - name: Build amd64+arm64 image (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            APP_REVISION=${{ github.sha }}

  candidate:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set candidate image reference
        id: meta
        run: |
          GIT_SHA_SHORT="$(git rev-parse --short=12 HEAD)"
          echo "GIT_SHA_FULL=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "GIT_SHA_SHORT=${GIT_SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/${{ github.repository_owner }}/life-admin-dev:git-${GIT_SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Check if candidate already exists
        id: check
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image_ref }}"
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Candidate exists::${IMAGE_REF} already published. Verifying digest."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing candidate digest
        if: steps.check.outputs.already_exists == 'true'
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image_ref }}"
          EXPECTED_SHA="${{ steps.meta.outputs.GIT_SHA_FULL }}"
          echo "Checking that ${IMAGE_REF} corresponds to commit ${EXPECTED_SHA}"

          # The image should have APP_REVISION baked in. We verify by checking
          # the source annotation if available, or just confirm the tag exists
          # and was built from a valid commit.
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest.Digest}}')"
          echo "::notice title=Candidate verified::${IMAGE_REF} exists with digest ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        if: steps.check.outputs.already_exists == 'false'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_REVISION=${{ steps.meta.outputs.GIT_SHA_FULL }}
          tags: ${{ steps.meta.outputs.image_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.GIT_SHA_FULL }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Record candidate digest
        if: steps.check.outputs.already_exists == 'false'
        run: |
          DIGEST="${{ steps.publish.outputs.digest }}"
          echo "::notice title=Candidate published::${{ steps.meta.outputs.image_ref }} with digest ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Print candidate summary
        run: |
          echo "### Candidate image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ steps.meta.outputs.GIT_SHA_FULL }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ steps.check.outputs.digest || steps.publish.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ steps.check.outputs.already_exists == 'true' && 'already existed' || 'published' }}" >> "$GITHUB_STEP_SUMMARY"
